# NOT USED by default since ADR-008: the worker runs inside the api service.
# Only for a standalone worker (WORKER_MODE=standalone on api), e.g. with an always-on DB.
# Railway config for that `worker` service (same image as api). No healthcheck: no HTTP port.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m app.jobs.worker"
restartPolicyType = "ALWAYS"
