# Canonical signal catalogue, payload contract v1 (ADR-006).
#
# Every reading the gateway stores uses one of these names. `id` is stored in
# readings.signal_id: NEVER reuse or renumber an id. Add new signals at the end.
#
# Fields:
#   id      stable numeric id (smallint in the DB)
#   pid     OBD-II Mode 01 PID (hex), or null for device-side signals
#   unit    SI-ish unit used everywhere downstream
#   group   polling group on the device:
#             fast   ~1 Hz while driving          slow   every 5 to 10 s
#             start  once per trip (trip start)   motion device accelerometer
#             device device-side measurements (not from the car)
#   dp      decimal places the device should round to (keeps payloads small)
#   min/max physically possible range; outside it, the gateway drops the sample.
#           For Mode 01 PIDs this is the range the SAE J1979 formula can produce.
#
# SEED - validate (P5): the group assignment = poll rate is a first guess; real adapter
# throughput is measured in Phase 8. Ranges for device signals are also SEED.

version: 1

signals:
  # ---- fast group (~1 Hz) -------------------------------------------------------
  - {id: 1,  name: rpm,          pid: "0C", unit: rpm,  group: fast,  dp: 0, min: 0,    max: 16383.75, desc: Engine speed}
  - {id: 2,  name: speed,        pid: "0D", unit: km/h, group: fast,  dp: 0, min: 0,    max: 255,      desc: Vehicle speed}
  - {id: 3,  name: load,         pid: "04", unit: "%",  group: fast,  dp: 1, min: 0,    max: 100,      desc: Calculated engine load}
  - {id: 4,  name: throttle,     pid: "11", unit: "%",  group: fast,  dp: 1, min: 0,    max: 100,      desc: Absolute throttle position}

  # ---- slow group (every 5 to 10 s) ---------------------------------------------
  - {id: 10, name: coolant,      pid: "05", unit: degC, group: slow,  dp: 0, min: -40,  max: 215,      desc: Engine coolant temperature}
  - {id: 11, name: iat,          pid: "0F", unit: degC, group: slow,  dp: 0, min: -40,  max: 215,      desc: Intake air temperature}
  - {id: 12, name: stft_b1,      pid: "06", unit: "%",  group: slow,  dp: 1, min: -100, max: 99.2,     desc: Short-term fuel trim bank 1}
  - {id: 13, name: ltft_b1,      pid: "07", unit: "%",  group: slow,  dp: 1, min: -100, max: 99.2,     desc: Long-term fuel trim bank 1}
  - {id: 14, name: stft_b2,      pid: "08", unit: "%",  group: slow,  dp: 1, min: -100, max: 99.2,     desc: Short-term fuel trim bank 2}
  - {id: 15, name: ltft_b2,      pid: "09", unit: "%",  group: slow,  dp: 1, min: -100, max: 99.2,     desc: Long-term fuel trim bank 2}
  - {id: 16, name: maf,          pid: "10", unit: g/s,  group: slow,  dp: 2, min: 0,    max: 655.35,   desc: Mass air flow}
  - {id: 17, name: map,          pid: "0B", unit: kPa,  group: slow,  dp: 0, min: 0,    max: 255,      desc: Intake manifold absolute pressure}
  - {id: 18, name: o2_b1s1_v,    pid: "14", unit: V,    group: slow,  dp: 3, min: 0,    max: 1.275,    desc: O2 sensor bank 1 sensor 1 voltage (upstream)}
  - {id: 19, name: o2_b1s2_v,    pid: "15", unit: V,    group: slow,  dp: 3, min: 0,    max: 1.275,    desc: O2 sensor bank 1 sensor 2 voltage (downstream)}
  - {id: 20, name: ecu_voltage,  pid: "42", unit: V,    group: slow,  dp: 2, min: 0,    max: 65.535,   desc: Control module voltage}
  - {id: 21, name: fuel_level,   pid: "2F", unit: "%",  group: slow,  dp: 0, min: 0,    max: 100,      desc: Fuel tank level input}
  - {id: 22, name: ambient,      pid: "46", unit: degC, group: slow,  dp: 0, min: -40,  max: 215,      desc: Ambient air temperature}
  - {id: 23, name: baro,         pid: "33", unit: kPa,  group: slow,  dp: 0, min: 0,    max: 255,      desc: Barometric pressure}
  - {id: 24, name: abs_load,     pid: "43", unit: "%",  group: slow,  dp: 1, min: 0,    max: 25700,    desc: Absolute load value}
  - {id: 25, name: timing_adv,   pid: "0E", unit: deg,  group: slow,  dp: 1, min: -64,  max: 63.5,     desc: Ignition timing advance (cylinder 1)}
  # Added 2026-11-17 (Phase 2 step 3). Cars with a wideband air/fuel sensor upstream
  # (most 2005+ Toyota/Lexus/Honda) report lambda here instead of an O2 voltage in 0x14.
  # SEED - validate: which PIDs each target car actually reports (P1).
  - {id: 26, name: lambda_b1s1,  pid: "34", unit: ratio, group: slow, dp: 3, min: 0,   max: 1.999,    desc: Equivalence ratio (lambda) bank 1 sensor 1 (wideband A/F sensor)}

  # ---- once per trip (trip start / end, and Quick Health Scan) ------------------
  - {id: 40, name: warmups_since_clear, pid: "30", unit: count, group: start, dp: 0, min: 0, max: 255,          desc: Warm-ups since codes cleared}
  - {id: 41, name: dist_since_clear,    pid: "31", unit: km,    group: start, dp: 0, min: 0, max: 65535,        desc: Distance since codes cleared}
  - {id: 42, name: dist_mil_on,         pid: "21", unit: km,    group: start, dp: 0, min: 0, max: 65535,        desc: Distance travelled with MIL on}
  - {id: 43, name: runtime_since_start, pid: "1F", unit: s,     group: start, dp: 0, min: 0, max: 65535,        desc: Run time since engine start}
  - {id: 44, name: odometer,            pid: "A6", unit: km,    group: start, dp: 1, min: 0, max: 429496729.5,  desc: Odometer (only some newer cars)}

  # ---- device-side --------------------------------------------------------------
  - {id: 60, name: batt_v,  pid: null, unit: V, group: device, dp: 2, min: 0,  max: 20, desc: "Battery voltage at the OBD port, measured by the device"}
  - {id: 61, name: acc_x,   pid: null, unit: g, group: motion, dp: 2, min: -16, max: 16, desc: Accelerometer x (device frame)}
  - {id: 62, name: acc_y,   pid: null, unit: g, group: motion, dp: 2, min: -16, max: 16, desc: Accelerometer y (device frame)}
  - {id: 63, name: acc_z,   pid: null, unit: g, group: motion, dp: 2, min: -16, max: 16, desc: Accelerometer z (device frame)}
  - {id: 64, name: device_temp, pid: null, unit: degC, group: device, dp: 0, min: -40, max: 125, desc: Device internal temperature}
