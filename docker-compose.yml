# Local development: Postgres only (ADR-003/004: no Redis, no TimescaleDB).
#   docker compose up -d db          # just the database (for pytest / uvicorn --reload)
#   docker compose up --build -d     # database + api (worker runs inside the api, ADR-008)
#   docker compose --profile standalone up -d   # also a separate worker container
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: autocare
      POSTGRES_PASSWORD: autocare
      POSTGRES_DB: autocare
    ports:
      - "5433:5432"   # 5433 on the host: a local Postgres already uses 5432
    volumes:
      - autocare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocare"]
      interval: 2s
      retries: 30

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://autocare:autocare@db:5432/autocare
      ENVIRONMENT: development
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations, then serve (on Railway this is the pre-deploy command).
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:  # optional: only for WORKER_MODE=standalone setups
    profiles: ["standalone"]
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://autocare:autocare@db:5432/autocare
      ENVIRONMENT: development
      WORKER_LISTEN: "true"
    depends_on:
      api:
        condition: service_started
    command: python -m app.jobs.worker

volumes:
  autocare_pgdata:
