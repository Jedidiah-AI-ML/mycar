[project]
name = "autocare-ml"
version = "0.1.0"
description = "AutoCare notebooks: dataset analysis, simulator calibration, model evaluation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.5",
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
]

[tool.uv]
package = false
